name: Auto-push images on commit to main 

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: checkout ts repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: semantic version for tagging images
        id: version
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(?i)Major|!:"
          minor_pattern: "(?i)Feature"
          version_format: "${major}.${minor}.${patch}"
        
      - name: git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}" --force


      - name: docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to registry
        uses: docker/login-action@v3
        with:
          registry: container.cs.vt.edu
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: build and push ts
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            container.cs.vt.edu/timwilson/job-queue-manager-images/backend:prod_latest
            container.cs.vt.edu/timwilson/job-queue-manager-images/backend:v${{ steps.version.outputs.version }}