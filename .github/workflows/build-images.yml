name: Auto-push images on commit to main

on:
  push:
    branches:
      - main

jobs:
  # ── Backend ─────────────────────────────────────────────────────────
  # Builds and pushes the AdonisJS backend image.
  # Triggers on any push to main that touches backend/ files.
  build-backend:
    runs-on: ubuntu-latest
    # Only run if backend files changed
    # Remove this filter if you want to always build on any push to main
    if: |
      contains(github.event.head_commit.modified, 'backend/') ||
      contains(github.event.head_commit.added, 'backend/') ||
      github.event_name == 'push'

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: semantic version for tagging images
        id: version
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(?i)Major|!:"
          minor_pattern: "(?i)Feature"
          version_format: "${major}.${minor}.${patch}"

      - name: git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}" --force

      - name: docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to registry
        uses: docker/login-action@v3
        with:
          registry: container.cs.vt.edu
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          provenance: false
          tags: |
            container.cs.vt.edu/timwilson/job-queue-manager-images/backend:prod_latest
            container.cs.vt.edu/timwilson/job-queue-manager-images/backend:v${{ steps.version.outputs.version }}

  # ── Frontend ─────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    needs: build-backend # remove this if frontend should build independently

    steps:
      - name: checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: semantic version for tagging images
        id: version
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(?i)Major|!:"
          minor_pattern: "(?i)Feature"
          version_format: "${major}.${minor}.${patch}"

      - name: docker buildx
        uses: docker/setup-buildx-action@v3

      - name: login to registry
        uses: docker/login-action@v3
        with:
          registry: container.cs.vt.edu
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: . # ← change from ./frontend to . (repo root)
          file: ./frontend/Dockerfile
          push: true
          provenance: false
          tags: |
            container.cs.vt.edu/timwilson/job-queue-manager-images/frontend:prod_latest
            container.cs.vt.edu/timwilson/job-queue-manager-images/frontend:v${{ steps.version.outputs.version }}

  # ── Deploy to Discovery Kubernetes ───────────────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-backend
      - build-frontend
    steps:
      - name: setup kubectl
        uses: azure/setup-kubectl@v4

      - name: configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.DISCOVERY_KUBECONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: rollout backend and frontend deployments
        run: |
          kubectl rollout restart deployment/backend -n 22012-job-queue-manager
          kubectl rollout restart deployment/frontend -n 22012-job-queue-manager

      - name: wait for rollout
        run: |
          kubectl rollout status deployment/backend -n 22012-job-queue-manager --timeout=300s
          kubectl rollout status deployment/frontend -n 22012-job-queue-manager --timeout=300s
