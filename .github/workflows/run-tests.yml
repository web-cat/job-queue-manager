name: Run Tests

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: webcatmaxxing
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      HOST: 0.0.0.0
      PORT: 3333
      APP_KEY: testkey-not-for-production-use-only
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: user
      DB_PASSWORD: webcatmaxxing
      DB_DATABASE: postgres
      LOG_LEVEL: error
      TZ: UTC
      CAS_BASE_URL: https://login.cs.vt.edu/cas
      CAS_SERVICE_URL: http://localhost:3333/api/auth/cas/callback
      FRONTEND_URL: http://localhost:3000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: webcatmaxxing
      AWS_REGION: us-east-1
      S3_BUCKET: data
      S3_ENDPOINT: http://localhost:9000

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: install pnpm
        run: npm install -g pnpm

      - name: install dependencies
        working-directory: backend
        run: pnpm install

      - name: run migrations
        working-directory: backend
        run: node ace migration:run

      - name: run tests
        working-directory: backend
        run: node ace test
